name: Migrate WordPress images (one-off)

on:
  push:
    branches: [migrate-images]
    paths: [scripts/migrate_wp_images.py, .github/workflows/migrate-images.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/migrate_wp_images.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A public/images/wp src/content/blog
          git commit -m "Copy WordPress images into the repo" || echo "nothing to commit"
          git push
