title: Mohamed Sahbi
tagline: Platform & Developer Experience Lead
description: >-
  Platform engineering, developer experience, GitHub, Azure DevOps and cloud
  automation in the enterprise. Notes from building internal platforms in Prague.
url: "https://mohamedsahbi.com"
baseurl: ""
author:
  name: Mohamed Sahbi
  twitter: Sahbi_Mohamed
social:
  github: MohamedSahbi
  linkedin: mohamedsahbi
  twitter: Sahbi_Mohamed
twitter:
  username: Sahbi_Mohamed
lang: en
timezone: Europe/Prague

# Keep WordPress-style URLs so old links keep working
permalink: /:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: page }
